name: Reset Repo & Init Clean Expo Project

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  reset-and-init:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wipe Old Files and Generate Fresh Expo Project
        run: |
          # Enable dotglob so hidden files (like .eslintrc, etc.) are included
          shopt -s dotglob

          # Delete all existing files/folders EXCEPT .git and .github directory
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Generate the fresh blank Expo project without running npm install
          npx create-expo-app@latest temp-app --template blank --no-install

          # Move all newly generated files to root directory
          mv temp-app/* .
          rm -rf temp-app

      - name: Commit and Push Clean Project
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all deletions and new files
          git add -A

          # Commit and push directly to main
          git commit -m "chore: reset repo with clean Expo project template" || echo "No changes to commit"
          git push origin main
          
