name: Reset Repo & Init Stable Expo App

on:
  workflow_dispatch:

jobs:
  reset-and-init:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wipe Old Files & Generate Stable Expo Project
        run: |
          shopt -s dotglob
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Lock strictly to stable Expo SDK 52
          npx create-expo-app@52 temp-app --template blank --no-install --yes

          # Inject standard package name immediately
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("temp-app/app.json", "utf8"));
            app.expo = app.expo || {};
            app.expo.android = app.expo.android || {};
            app.expo.android.package = "com.anonymous.reactapp";
            fs.writeFileSync("temp-app/app.json", JSON.stringify(app, null, 2));
          '

          mv temp-app/* .
          rm -rf temp-app

      - name: Commit and Push Clean Project
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold clean stable Expo SDK 52" || echo "No changes"
          git push origin main
          
