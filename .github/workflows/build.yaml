name: Reset Repo & Init Modern Expo App

on:
  workflow_dispatch:

jobs:
  reset-and-init:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wipe Old Files & Generate Official Expo Template
        run: |
          shopt -s dotglob

          # 1. Remove all old files except git configs
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # 2. Create official Expo project using the default tabs + router template
          npx create-expo-app@latest temp-app --template default --no-install --yes

          # 3. Move everything to repo root
          mv temp-app/* .
          rm -rf temp-app

      - name: Commit and Push to Main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: scaffold official Expo app with Expo Router" || echo "No changes"
          git push origin main
          
