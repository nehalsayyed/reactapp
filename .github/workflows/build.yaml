name: Re-initialize Repo with Expo App

on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Expo Template (e.g., blank, tabs, default, blank-typescript)'
        required: false
        default: 'blank-typescript'
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  scaffold-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scaffold Expo Project
        run: |
          # 1. Create a fresh Expo app in a temporary folder
          npx create-expo-app@latest temp-expo-app --template ${{ github.event.inputs.template }} --no-install

          # 2. Delete all existing repo files except .git and .github (preserving this workflow)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'temp-expo-app' -exec rm -rf {} +

          # 3. Move the scaffolded project files to the repository root
          cp -r temp-expo-app/. .
          rm -rf temp-expo-app

          # 4. Generate package-lock.json without downloading node_modules
          npm install --package-lock-only

      - name: Commit and Push
        run: |
          git add -A
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: re-initialize repository with fresh Expo app (${{ github.event.inputs.template }})"
            git push origin ${{ github.event.inputs.branch }}
          fi
          
