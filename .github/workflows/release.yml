name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Ensure Android Package Name
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo = app.expo || {};
            app.expo.android = app.expo.android || {};
            if (!app.expo.android.package) {
              app.expo.android.package = "com.anonymous.reactapp";
            }
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          '

      - name: Prebuild Native Android
        run: npx expo prebuild --platform android --clean

      - name: Restrict to ARM64 Only
        run: |
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

      - name: Grant Gradle Permissions
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" build-output/app-debug-arm64.apk
          echo "Debug APK created successfully:"
          ls -lh build-output/app-debug-arm64.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arm64
          path: build-output/app-debug-arm64.apk
          retention-days: 7
          
