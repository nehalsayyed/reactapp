name: Build Production ARM64 Release APK

on:
  workflow_dispatch: # Trigger manually from GitHub web UI only

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Generate Temporary Release Keystore & Configure Signing
        run: |
          cd android/app
          # Generate a valid 2048-bit RSA release signing key
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android123 \
            -keypass android123 \
            -dname "CN=ExpoApp, OU=Dev, O=Solo, L=City, S=State, C=US"

          # Inject the keystore parameters into gradle.properties
          echo "MYAPP_UPLOAD_STORE_FILE=release.keystore" >> ../gradle.properties
          echo "MYAPP_UPLOAD_KEY_ALIAS=release-key" >> ../gradle.properties
          echo "MYAPP_UPLOAD_STORE_PASSWORD=android123" >> ../gradle.properties
          echo "MYAPP_UPLOAD_KEY_PASSWORD=android123" >> ../gradle.properties

      - name: Enable Release Minification & Single Architecture
        run: |
          # Restrict native compilation strictly to ARM64-v8a
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties
          echo "android.enableR8=true" >> android/gradle.properties
          echo "android.enableR8.fullMode=true" >> android/gradle.properties

      - name: Grant Gradle Execution Permission
        run: chmod +x android/gradlew

      - name: Build Optimized Release APK
        run: |
          cd android
          # Run assembleRelease with ARM64 target and Hermes bytecode optimization
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" build-output/app-arm64-release.apk
          echo "APK generated successfully at build-output/app-arm64-release.apk"
          ls -lh build-output/

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-arm64
          path: build-output/app-arm64-release.apk
          retention-days: 14
          
