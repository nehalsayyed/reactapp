name: Build Production ARM64 Release APK

on:
  workflow_dispatch:

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Configure ARM64 Architecture Only
        run: |
          # Restrict build strictly to arm64-v8a to minimize size
          echo "reactNativeArchitectures=arm64-v8a" >> android/gradle.properties

      - name: Grant Gradle Execution Permission
        run: chmod +x android/gradlew

      - name: Build Minified Release APK
        run: |
          cd android
          # Assemble release APK
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            # Check unsigned output if signing configuration wasn't picked up
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          cp "$APK_PATH" build-output/app-arm64-release.apk
          echo "APK successfully created:"
          ls -lh build-output/app-arm64-release.apk

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-arm64
          path: build-output/app-arm64-release.apk
          retention-days: 14
          
