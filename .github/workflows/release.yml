name: Build Production ARM64 Release APK

on:
  workflow_dispatch:

jobs:
  build-arm64-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Create Minimal eas.json Config
        run: |
          cat << 'EOF' > eas.json
          {
            "cli": {
              "version": ">= 10.0.0"
            },
            "build": {
              "preview": {
                "android": {
                  "buildType": "apk"
                },
                "env": {
                  "NODE_ENV": "production"
                }
              }
            }
          }
          EOF

      - name: Build Standalone APK Locally on Runner
        run: |
          # EAS local build compiles the APK completely on GitHub runner (100% free)
          eas build --local --platform android --profile preview --non-interactive --output=./app-release.apk

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-arm64
          path: ./app-release.apk
          retention-days: 14
          
